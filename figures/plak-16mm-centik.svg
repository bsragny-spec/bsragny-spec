<text x="560.0" y="158.8" text-anchor="start" font-size="9">4.25 mm merkez</text>
<text x="560.0" y="170.8" text-anchor="start" font-size="9">5.1 mm kenar</text>
<text x="200" y="428" text-anchor="middle" font-size="11" fill="#555">Üstten görünüş, anterior (kanal ağızları) altta</text>
<text x="450" y="117" text-anchor="middle" font-size="11" fill="#555">Kesit, kanal eksenine dik; duvar eksene paralel</text>
<text x="30" y="452" font-size="10.5" fill="#222">Çap 16 mm, çentikli: jukstapapiller tümör, taban ≤ 12 mm, posterior kenarı disk kenarında; bir boy büyük seçilir</text>
<text x="30" y="469" font-size="10.5" fill="#222">Kanal: 5 paralel kör kiriş, x = -6.3, -3.1, +0.0, +3.1, +6.3 mm; 3 tanesi çentikte kısaltılmış; iç çap 1.2 mm</text>
<text x="30" y="486" font-size="10.5" fill="#222">Bekleme pozisyonu: 13 adet, adım 2.5 mm, kör uç ölü boşluğu 2.0 mm</text>
<text x="30" y="503" font-size="10.5" fill="#222">En uzun kanal yayı 15.4 mm; eğrilik yalnızca küreden (13.8 mm); eksen skleradan 1.5 mm</text>
<text x="30" y="520" font-size="10.5" fill="#222">Katmanlar: ara katman 0.85 mm, kanal katmanı 1.9 mm, altın sırt 1.5 mm; kenar kalkanı 0.5 mm; dış kenar 1.5 mm yuvarlatılmış</text>
<text x="30" y="537" font-size="10.5" fill="#222">Kubbe derinliği (sagitta) 3.0 mm, yarım açı 41°; iç eğrilik yarıçapı 12.3 mm; kenar duvar yüksekliği 5.1 mm</text>
<text x="30" y="554" font-size="10.5" fill="#222">Sütür deliği 3 adet, Ø 0,8 mm. Her kanal kendi altın ağzından çıkar; kanal başına ayrı kateter, ayrı transfer tüpü.</text>
<text x="30" y="571" font-size="10.5" fill="#222">Çentik: U biçimli, genişlik 10 mm, sinir ekseni plak merkezinden 7 mm (kenardan 1 mm içeride), dip merkezden 2 mm; kalkan çentiği izler</text>
<text x="320.0" y="626" text-anchor="middle" font-size="10" fill="#777">Şematik tasarım çizimi, taslak v0.1. Üretim çizimi değildir; toleranslar belge 02.</text>
</svg>
