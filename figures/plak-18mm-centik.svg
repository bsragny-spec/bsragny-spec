<text x="590.0" y="158.8" text-anchor="start" font-size="9">4.25 mm</text>
<text x="200" y="438" text-anchor="middle" font-size="11" fill="#555">Üstten görünüş, anterior (giriş hattı) altta</text>
<text x="470" y="117" text-anchor="middle" font-size="11" fill="#555">Kesit, kanal eksenine dik</text>
<text x="30" y="452" font-size="10.5" fill="#222">Çap 18 mm, çentikli: jukstapapiller tümör, taban ≤ 14 mm, posterior kenarı disk kenarında; bir boy büyük seçilir</text>
<text x="30" y="469" font-size="10.5" fill="#222">Kanal: 5 yelpaze ışını, ±45°, giriş sırası aralığı 1.7 mm; 3 tanesi çentikte kısaltılmış; iç çap 1.2 mm</text>
<text x="30" y="486" font-size="10.5" fill="#222">Bekleme pozisyonu: 21 adet, adım 2.5 mm, kör uç ölü boşluğu 2.0 mm</text>
<text x="30" y="503" font-size="10.5" fill="#222">En uzun kanal 13.1 mm; düzlemde düz, eğrilik yalnızca küreden (13.8 mm); eksen skleradan 1.5 mm</text>
<text x="30" y="520" font-size="10.5" fill="#222">Katmanlar: ara katman 0.85 mm, kanal katmanı 1.9 mm, altın sırt 1.5 mm; kenar kalkanı 0.5 mm tam yükseklik</text>
<text x="30" y="537" font-size="10.5" fill="#222">Kubbe derinliği (sagitta) 3.9 mm, yarım açı 47°; iç eğrilik yarıçapı 12.3 mm</text>
<text x="30" y="554" font-size="10.5" fill="#222">Sütür deliği 3 adet, Ø 0,8 mm. Kabukla tek parça yassı sap, ucunda tek kilitli konektör ve Ø 4,5 mm kılıf.</text>
<text x="30" y="571" font-size="10.5" fill="#222">Çentik: U biçimli, genişlik 10 mm, sinir ekseni plak merkezinden 8 mm (kenardan 1 mm içeride), dip merkezden 3 mm; kalkan çentiği izler</text>
<text x="320.0" y="626" text-anchor="middle" font-size="10" fill="#777">Şematik tasarım çizimi, taslak v0.1. Üretim çizimi değildir; toleranslar belge 02.</text>
</svg>
