<text x="600.0" y="158.8" text-anchor="start" font-size="9">4.25 mm</text>
<text x="200" y="448" text-anchor="middle" font-size="11" fill="#555">Üstten görünüş, anterior (giriş hattı) altta</text>
<text x="470" y="117" text-anchor="middle" font-size="11" fill="#555">Kesit, kanal eksenine dik</text>
<text x="30" y="452" font-size="10.5" fill="#222">Çap 20 mm, çentikli: jukstapapiller tümör, taban ≤ 16 mm, posterior kenarı disk kenarında; bir boy büyük seçilir</text>
<text x="30" y="469" font-size="10.5" fill="#222">Kanal: 7 yelpaze ışını, ±45°, giriş sırası aralığı 1.7 mm; 3 tanesi çentikte kısaltılmış; iç çap 1.2 mm</text>
<text x="30" y="486" font-size="10.5" fill="#222">Bekleme pozisyonu: 32 adet, adım 2.5 mm, kör uç ölü boşluğu 2.0 mm</text>
<text x="30" y="503" font-size="10.5" fill="#222">En uzun kanal 14.8 mm; düzlemde düz, eğrilik yalnızca küreden (13.8 mm); eksen skleradan 1.5 mm</text>
<text x="30" y="520" font-size="10.5" fill="#222">Katmanlar: ara katman 0.85 mm, kanal katmanı 1.9 mm, altın sırt 1.5 mm; kenar kalkanı 0.5 mm; dış kenar 1.5 mm yuvarlatılmış</text>
<text x="30" y="537" font-size="10.5" fill="#222">Kubbe derinliği (sagitta) 5.1 mm, yarım açı 54°; iç eğrilik yarıçapı 12.3 mm</text>
<text x="30" y="554" font-size="10.5" fill="#222">Sütür deliği 3 adet, Ø 0,8 mm. Kabuk kenarından tek giriş hattı: oval kök, 10 mm sonra Ø 4,8 mm yuvarlak kılıf, ucunda tek konektör.</text>
<text x="30" y="571" font-size="10.5" fill="#222">Çentik: U biçimli, genişlik 10 mm, sinir ekseni plak merkezinden 9 mm (kenardan 1 mm içeride), dip merkezden 4 mm; kalkan çentiği izler</text>
<text x="320.0" y="626" text-anchor="middle" font-size="10" fill="#777">Şematik tasarım çizimi, taslak v0.1. Üretim çizimi değildir; toleranslar belge 02.</text>
</svg>
