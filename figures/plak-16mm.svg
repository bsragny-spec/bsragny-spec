<text x="580.0" y="158.8" text-anchor="start" font-size="9">4.25 mm</text>
<text x="200" y="395" text-anchor="middle" font-size="11" fill="#555">Üstten görünüş, anterior (giriş sapı) altta</text>
<text x="470" y="117" text-anchor="middle" font-size="11" fill="#555">Kesit, kanal eksenine dik</text>
<text x="30" y="440" font-size="10.5" fill="#222">Çap 16 mm, tümör tabanı ≤ 12 mm için</text>
<text x="30" y="457" font-size="10.5" fill="#222">Kanal: 5 yelpaze ışını, ±45°, giriş sırası aralığı 1.7 mm, iç çap 1.2 mm</text>
<text x="30" y="474" font-size="10.5" fill="#222">Bekleme pozisyonu: 23 adet, adım 2.5 mm, kör uç ölü boşluğu 2.0 mm</text>
<text x="30" y="491" font-size="10.5" fill="#222">En uzun kanal 13.2 mm; düzlemde düz, eğrilik yalnızca küreden (13.8 mm); eksen skleradan 1.5 mm</text>
<text x="30" y="508" font-size="10.5" fill="#222">Katmanlar: ara katman 0.85 mm, kanal katmanı 1.9 mm, altın sırt 1.5 mm; kenar kalkanı 0.5 mm tam yükseklik</text>
<text x="30" y="525" font-size="10.5" fill="#222">Kubbe derinliği (sagitta) 3.0 mm, yarım açı 41°; iç eğrilik yarıçapı 12.3 mm</text>
<text x="30" y="542" font-size="10.5" fill="#222">Sütür deliği 3 adet, Ø 0,8 mm. Kabukla tek parça yassı sap, ucunda tek kilitli konektör ve Ø 4,5 mm kılıf.</text>
<text x="320.0" y="586" text-anchor="middle" font-size="10" fill="#777">Şematik tasarım çizimi, taslak v0.1. Üretim çizimi değildir; toleranslar belge 02.</text>
</svg>
