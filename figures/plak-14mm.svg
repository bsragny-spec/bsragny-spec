<text x="550.0" y="158.8" text-anchor="start" font-size="9">4.25 mm merkez</text>
<text x="550.0" y="170.8" text-anchor="start" font-size="9">4.9 mm kenar</text>
<text x="215" y="418" text-anchor="middle" font-size="11" fill="#555">Üstten görünüş, anterior (kanal ağızları) altta</text>
<text x="450" y="117" text-anchor="middle" font-size="11" fill="#555">Kesit, kanal eksenine dik; duvar eksene paralel</text>
<text x="30" y="452" font-size="10.5" fill="#222">Çap 14 mm, tümör tabanı ≤ 10 mm için</text>
<text x="30" y="469" font-size="10.5" fill="#222">Kanal: 3 paralel kör kiriş, x = -3.5, +0.0, +3.5 mm (LP ile seçildi), iç çap 1.2 mm</text>
<text x="30" y="486" font-size="10.5" fill="#222">Bekleme pozisyonu: 12 adet, adım 2.5 mm, kör uç ölü boşluğu 2.0 mm</text>
<text x="30" y="503" font-size="10.5" fill="#222">En uzun kanal yayı 13.1 mm; eğrilik yalnızca küreden (13.8 mm); eksen skleradan 1.5 mm</text>
<text x="30" y="520" font-size="10.5" fill="#222">Katmanlar: ara katman 0.85 mm, kanal katmanı 1.9 mm, altın sırt 1.5 mm; kenar kalkanı 0.5 mm; dış kenar 1.5 mm yuvarlatılmış</text>
<text x="30" y="537" font-size="10.5" fill="#222">Kubbe derinliği (sagitta) 2.2 mm, yarım açı 35°; iç eğrilik yarıçapı 12.3 mm; kenar duvar yüksekliği 4.9 mm</text>
<text x="30" y="554" font-size="10.5" fill="#222">Sütür küpesi 2 adet, dış ağızların yanında, Ø 2.4 mm kulakçık, delik Ø 0.8 mm. Her kanal kendi altın ağzından çıkar; kanal başına ayrı kateter.</text>
<text x="320.0" y="626" text-anchor="middle" font-size="10" fill="#777">Şematik tasarım çizimi, taslak v0.1. Üretim çizimi değildir; toleranslar belge 02.</text>
