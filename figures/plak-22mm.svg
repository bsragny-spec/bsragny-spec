<text x="40" y="560" font-size="11" fill="#222">Kubbe derinliği (sagitta) 6.8 mm, yarım açı 63°; iç eğrilik yarıçapı 12.3 mm</text>
<text x="40" y="578" font-size="11" fill="#222">Sütür deliği 3 adet, Ø 0,8 mm. Tek giriş bloğu, tek kilitli konektör, tek kılıf.</text>
<text x="320.0" y="626" text-anchor="middle" font-size="10" fill="#777">Şematik tasarım çizimi, taslak v0.1. Üretim çizimi değildir; toleranslar belge 02.</text>
