<text x="470" y="132" text-anchor="middle" font-size="11" fill="#555">Kesit, kanal eksenine dik</text>
<text x="40" y="470" font-size="11" fill="#222">Çap 22 mm, tümör tabanı ≤ 18 mm için</text>
<text x="40" y="488" font-size="11" fill="#222">Kanal: 7 paralel kör kiriş, aralık 2.83 mm, iç çap 1.2 mm</text>
<text x="40" y="506" font-size="11" fill="#222">Bekleme pozisyonu: 39 adet, adım 2.5 mm, kör uç ölü boşluğu 2.0 mm</text>
<text x="40" y="524" font-size="11" fill="#222">En uzun kanal yayı 21.0 mm; eksen skleradan 1.5 mm, küre yarıçapı 13.8 mm</text>
