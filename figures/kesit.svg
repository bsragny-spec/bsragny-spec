<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" font-family="Arial, Helvetica, sans-serif" font-size="11">
  <title>Yb-169 HDR episkleral aplikatör, kanal eksenine dik kesit (16 mm plak, 5 kanal)</title>
  <rect width="560" height="440" fill="#ffffff"/>
  <text x="280" y="22" text-anchor="middle" font-size="14" font-weight="bold">Kesit, kanal eksenine dik (16 mm plak, 5 kanal), ölçek 10 px = 1 mm</text>
  <!-- göz küresi içi -->
  <circle cx="200" cy="420" r="113" fill="#fdf3e7" stroke="none"/>
  <!-- sklera bandı 1 mm: r 113 -> 123 -->
  <path d="M 93.5 358.5 A 123 123 0 0 1 306.5 358.5 L 297.9 363.5 A 113 113 0 0 0 102.1 363.5 Z" fill="#e8dcc8" stroke="#8a7a60" stroke-width="1"/>
  <!-- tümör kubbesi, apeks iç skleradan 5 mm -->
  <path d="M 148 320 Q 200 300 252 320 Q 240 352 200 357 Q 160 352 148 320 Z" fill="#c98a8a" stroke="#7a3c3c" stroke-width="1"/>
  <!-- katman 1: ara katman r 123 -> 131.5 -->
  <path d="M 124.3 323.1 A 123 123 0 0 1 275.7 323.1 L 281.0 316.4 A 131.5 131.5 0 0 0 119.0 316.4 Z" fill="#d9ecf5" stroke="#4a7c96" stroke-width="1"/>
  <!-- katman 2: kanal katmanı r 131.5 -> 149.5 -->
  <path d="M 119.0 316.4 A 131.5 131.5 0 0 1 281.0 316.4 L 292.0 302.2 A 149.5 149.5 0 0 0 108.0 302.2 Z" fill="#eef4f7" stroke="#4a7c96" stroke-width="1"/>
  <!-- katman 3: sırt koruması r 149.5 -> 164.5, dudak dahil -->
  <path d="M 108.0 302.2 A 149.5 149.5 0 0 1 292.0 302.2 L 301.3 290.4 A 164.5 164.5 0 0 0 98.7 290.4 Z" fill="#e6c96a" stroke="#8a6d1a" stroke-width="1.2"/>
  <!-- dudaklar: sırt kabuğu sklera yönünde 4.15 mm iner (r 164.5 -> 123), kalınlık 0.5 mm -->
  <path d="M 98.7 290.4 L 101.8 294.3 L 127.5 327.0 L 124.3 323.1 Z" fill="#e6c96a" stroke="#8a6d1a" stroke-width="1.2"/>
  <path d="M 301.3 290.4 L 298.2 294.3 L 272.5 327.0 L 275.7 323.1 Z" fill="#e6c96a" stroke="#8a6d1a" stroke-width="1.2"/>
  <!-- kanallar: eksen r 138 (skleradan 1.5 mm), iç çap 1.1 mm, dış 1.5 mm -->
  <g stroke="#2b4c5e" stroke-width="1">
    <circle cx="200" cy="282.0" r="7.5" fill="#b8c7d1"/><circle cx="200" cy="282.0" r="5.5" fill="#ffffff"/>
    <circle cx="172.5" cy="284.8" r="7.5" fill="#b8c7d1"/><circle cx="172.5" cy="284.8" r="5.5" fill="#ffffff"/>
    <circle cx="227.5" cy="284.8" r="7.5" fill="#b8c7d1"/><circle cx="227.5" cy="284.8" r="5.5" fill="#ffffff"/>
    <circle cx="145.0" cy="293.4" r="7.5" fill="#b8c7d1"/><circle cx="145.0" cy="293.4" r="5.5" fill="#ffffff"/>
    <circle cx="255.0" cy="293.4" r="7.5" fill="#b8c7d1"/><circle cx="255.0" cy="293.4" r="5.5" fill="#ffffff"/>
  </g>
  <!-- kaynak, merkez kanalda -->
  <circle cx="200" cy="282.0" r="4" fill="#c0392b"/>
  <!-- merkez eksen ve ölçüler -->
  <line x1="200" y1="240" x2="200" y2="370" stroke="#555" stroke-width="0.6" stroke-dasharray="3 3"/>
  <!-- etiketler -->
  <g font-size="11" fill="#222">
    <line x1="340" y1="262" x2="262" y2="262" stroke="#8a6d1a" stroke-width="0.8"/>
    <text x="345" y="266">3. Sırt koruması, 1,5 mm altın / W alaşım</text>
    <line x1="340" y1="285" x2="263" y2="291" stroke="#2b4c5e" stroke-width="0.8"/>
    <text x="345" y="289">2. Kanal katmanı, PEEK içinde 5 kör kanal</text>
    <text x="345" y="302" font-size="10" fill="#444">iç çap 1,1 mm, dış çap 1,5 mm, aralık 2,75 mm</text>
    <line x1="340" y1="318" x2="270" y2="322" stroke="#4a7c96" stroke-width="0.8"/>
    <text x="345" y="322">1. Ara katman, 0,85 mm</text>
    <line x1="340" y1="340" x2="290" y2="360" stroke="#8a7a60" stroke-width="0.8"/>
    <text x="345" y="344">Sklera, 1 mm</text>
    <line x1="340" y1="370" x2="230" y2="340" stroke="#7a3c3c" stroke-width="0.8"/>
    <text x="345" y="374">Tümör, apeks iç skleradan 5 mm</text>
    <line x1="340" y1="395" x2="204" y2="284" stroke="#c0392b" stroke-width="0.8"/>
    <text x="345" y="399">Yb-169 kaynağı, bekleme pozisyonunda</text>
    <text x="345" y="412" font-size="10" fill="#444">bekleme ekseni skleradan 1,5 mm</text>
    <text x="30" y="345" font-size="10" fill="#8a6d1a">Kenar dudağı</text>
    <line x1="92" y1="341" x2="125" y2="326" stroke="#8a6d1a" stroke-width="0.8"/>
  </g>
  <!-- ölçü çizgileri sol -->
  <g stroke="#333" stroke-width="0.7" fill="#333" font-size="10">
    <line x1="80" y1="255.5" x2="80" y2="297" /><line x1="76" y1="255.5" x2="84" y2="255.5"/><line x1="76" y1="297" x2="84" y2="297"/>
    <text x="20" y="279">4,15 mm</text>
    <line x1="200" y1="240" x2="200" y2="240"/>
  </g>
  <!-- R notu -->
  <text x="280" y="42" text-anchor="middle" font-size="10" fill="#555">İç eğrilik yarıçapı 12,3 mm; giriş bloğu bu kesitte görünmez (kanallara dik)</text>
  <text x="280" y="56" text-anchor="middle" font-size="10" fill="#777">Şematik; koruma kalınlığı ve bekleme yüksekliği Monte Carlo ile dondurulacaktır.</text>
</svg>
